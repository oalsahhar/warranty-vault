<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8"> 
  <meta name="description" content="Keep all your warranties in one place">
  <meta name="author" content="Omar Alsahhar & Mohammad Alzahrani">
  <title>	Warranty Vault | Login</title>
</head>
<body>

  <header>
    <h1><a href="index.html">Warranty Vault</a></h1>
    <nav>
      <ul>
        <li><a href="dashboard.html">My Products</a></li>
        <li><a href="add-product.html">Add Product</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Login</h2>

    <!-- Login form: after logging in, go to the dashboard -->
    <section>
      <h3>Welcome Back</h3>
      <form action="dashboard.html" method="get">
        <p>
          <label for="login-email">Email</label><br>
          <input type="email" id="login-email" name="email" placeholder="name@example.com" required>
        </p>
        <p>
          <label for="login-password">Password</label><br>
          <input type="password" id="login-password" name="password" required>
        </p>
        <p>
          <button type="submit">Login</button>
        </p>
      </form>
      <p>Don't have an account? <a href="#register">Create one</a></p>
    </section>

    <!-- Register form: the link above jumps to this id -->
    <section id="register">
      <h3>Create an Account</h3>
      <form action="dashboard.html" method="get">
        <p>
          <label for="reg-name">Name</label><br>
          <input type="text" id="reg-name" name="name" placeholder="e.g. Omar" required>
        </p>
        <p>
          <label for="reg-email">Email</label><br>
          <input type="email" id="reg-email" name="email" placeholder="name@example.com" required>
        </p>
        <p>
          <label for="reg-password">Password</label><br>
          <input type="password" id="reg-password" name="password" required>
        </p>
        <p>
          <button type="submit">Create Account</button>
        </p>
      </form>
    </section>

    <p>Your product pages open only after you log in.</p>
  </main>

  <footer>
    <p>CPIS 358 Project - Omar Alsahhar &amp; Mohammad Alzahrani</p>
  </footer>

</body>
</html>
