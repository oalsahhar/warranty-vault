<main> 

    <h2>Sign Up</h2>
    <section>
      <h3>Create an Account</h3>
      <form action="dashboard.html" method="get">
        <p>
          <label for="reg-name">Name</label><br>
          <input type="text" id="reg-name" name="name" placeholder="e.g. Omar" required>
        </p>
        <p>
          <label for="reg-email">Email</label><br>
          <input type="email" id="reg-email" name="email" placeholder="name@example.com" required>
        </p>
        <p>
          <label for="reg-password">Password</label><br>
          <input type="password" id="reg-password" name="password" minlength="8" required>
        </p>
        <p>
          <label for="reg-confirm">Confirm password</label><br>
          <input type="password" id="reg-confirm" name="confirm" minlength="8" required>
        </p>
        <p>
          <button type="submit">Create Account</button>
        </p>
      </form>
      <p>Already have an account? <a href="login.html">Login</a></p>
    </section>
